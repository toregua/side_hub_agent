name: Release

on:
  push:
    tags:
      - 'v*'

# Actions are pinned by commit SHA (tags can be moved); Dependabot bumps them (.github/dependabot.yml).
# Least privilege by default: jobs that need more ask for it explicitly.
permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rid: osx-arm64
            artifact: sidehub-agent-osx-arm64
          - os: macos-latest
            rid: osx-x64
            artifact: sidehub-agent-osx-x64
          - os: windows-latest
            rid: win-x64
            artifact: sidehub-agent-win-x64
          - os: windows-latest
            rid: win-arm64
            artifact: sidehub-agent-win-arm64
          - os: ubuntu-latest
            rid: linux-x64
            artifact: sidehub-agent-linux-x64
          - os: ubuntu-latest
            rid: linux-arm64
            artifact: sidehub-agent-linux-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # The tag name is attacker-controllable for anyone allowed to push tags (a ref can contain
      # ; $ | & `): it is only ever read from the environment, never interpolated with ${{ }}
      # into a script, and must be a plain version before it reaches GITHUB_ENV or a command line.
      - name: Resolve version from tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::Refusing to release from tag '$TAG': expected v<digits>(.<digits>)*"
            exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Publish Agent
        shell: bash
        env:
          RID: ${{ matrix.rid }}
        run: |
          dotnet publish SideHub.Agent -c Release -r "$RID" --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true "-p:Version=$VERSION" -o ./publish

      - name: Publish CLI
        shell: bash
        env:
          RID: ${{ matrix.rid }}
        run: |
          dotnet publish SideHub.Cli -c Release -r "$RID" --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true "-p:Version=$VERSION" -o ./publish-cli

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # node_modules ships in the archive so installs never resolve packages from the registry.
      # npm ci installs exactly the lockfile (integrity-checked); --ignore-scripts skips node-pty's
      # install scripts, which are only needed to compile from source: every target has a prebuild.
      - name: Bundle pty-helper dependencies
        shell: bash
        working-directory: publish/pty-helper
        env:
          RID: ${{ matrix.rid }}
        run: |
          npm ci --omit=dev --ignore-scripts
          case "$RID" in
            osx-*) platform=darwin ;;
            win-*) platform=win32 ;;
            *) platform=linux ;;
          esac
          prebuild="$platform-${RID##*-}"
          test -d "node_modules/node-pty/prebuilds/$prebuild"
          # Only this platform's native prebuild is needed
          find node_modules/node-pty/prebuilds -mindepth 1 -maxdepth 1 ! -name "$prebuild" -exec rm -rf {} +

      - name: Create tar.gz archive (Unix)
        if: runner.os != 'Windows'
        run: |
          cd publish
          mv sidehub-agent sidehub-agent-binary
          mkdir -p package
          mv sidehub-agent-binary package/sidehub-agent
          cp ../publish-cli/sidehub-cli package/sidehub-cli
          cp -r pty-helper package/
          cp -r cli-wrappers package/
          cp -r ../contrib package/
          cd package
          tar -czvf ../${{ matrix.artifact }}.tar.gz *

      - name: Create zip archive (Windows)
        if: runner.os == 'Windows'
        run: |
          cd publish
          mkdir package
          move sidehub-agent.exe package\sidehub-agent.exe
          copy ..\publish-cli\sidehub-cli.exe package\sidehub-cli.exe
          xcopy pty-helper package\pty-helper\ /E /I
          xcopy cli-wrappers package\cli-wrappers\ /E /I
          cd package
          Compress-Archive -Path * -DestinationPath ..\${{ matrix.artifact }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ./publish/${{ matrix.artifact }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance attestation (Sigstore, signed with the workflow's OIDC identity)
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release/

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > checksums.sha256

      # The install scripts only trust checksums.sha256 if it carries a valid signature from the key embedded in
      # them: write access to the release alone cannot ship a tampered archive with a matching checksum.
      # RELEASE_SIGNING_KEY is the PEM private key (RSA); a release without it fails rather than ship unsigned.
      - name: Sign checksums
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::RELEASE_SIGNING_KEY secret is not set: refusing to publish an unsigned release (see SECURITY.md)"
            exit 1
          fi
          umask 077
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key_file"
          openssl dgst -sha256 -sign "$key_file" -out release/checksums.sha256.sig release/checksums.sha256
          # Check against the public key the install scripts ship, so a key mismatch never reaches users
          sed -n '/-----BEGIN PUBLIC KEY-----/,/-----END PUBLIC KEY-----/p' scripts/install.sh | tr -d "'" | sed 's/^RELEASE_SIGNING_PUBKEY=//' > pubkey.pem
          openssl dgst -sha256 -verify pubkey.pem -signature release/checksums.sha256.sig release/checksums.sha256

      # Verify with: gh attestation verify <file> --repo toregua/side_hub_agent (see SECURITY.md)
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.tar.gz
            release/*.zip
            release/checksums.sha256

      # Created as a draft, then published once every asset is attached: with immutable releases enabled on
      # the repository, assets can no longer be added, replaced or deleted after publication.
      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          generate_release_notes: true
          files: |
            release/*

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
